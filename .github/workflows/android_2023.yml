name: Build-Multi

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk-lmod:
    name: Android APK (lmod)
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Clone modlauncher and install dependencies
        run: |
          git clone https://github.com/stephen-cusi/modlauncher-waf -b lmod
          sudo apt-get update
          sudo apt-get install -f -y openjdk-8-jre zip apksigner

      - name: Build Android (32 bit)
        run: scripts/build-android-armv7a.sh

      - name: Build Android (64 bit)
        run: |
          sudo chmod +x scripts/build-android-arm64.sh
          scripts/build-android-arm64.sh

      - name: Build APK
        run: |
          chmod +x scripts/sbuild-apk.sh
          scripts/sbuild-apk.sh

      - name: Rename APK
        run: mv modlauncher-waf/build/android/mod-signed.apk lmod-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: lmod-apk
          path: lmod-release.apk
          if-no-files-found: error

  build-apk-hl2mp:
    name: Android APK (hl2mp)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Clone modlauncher and install dependencies
        run: |
          git clone https://github.com/stephen-cusi/modlauncher-waf -b hl2mp
          sudo apt-get update
          sudo apt-get install -f -y openjdk-8-jre zip apksigner

      - name: Build Android (32 bit)
        run: scripts/build-android-armv7a_hl2mp.sh

      - name: Build Android (64 bit)
        run: |
          sudo chmod +x scripts/build-android-arm64_hl2mp.sh
          scripts/build-android-arm64_hl2mp.sh

      - name: Build APK
        run: |
          chmod +x scripts/sbuild-apk_hl2mp.sh
          scripts/sbuild-apk_hl2mp.sh

      - name: Rename APK
        run: mv modlauncher-waf/build/android/mod-signed.apk hl2mp-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: hl2mp-apk
          path: hl2mp-release.apk
          if-no-files-found: error

  build-windows-amd64:
    name: Windows (x64)
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Build windows-amd64
        run: |
          ./waf.bat configure -T release --prefix=./win --disable-warns
          ./waf.bat install
          scripts\delete_file.cmd

      - name: Upload Windows build
        uses: actions/upload-artifact@v7
        with:
          name: hl2-win-amd64
          path: ./win
          if-no-files-found: error
