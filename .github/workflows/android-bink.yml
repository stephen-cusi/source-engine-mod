name: Android Bink Check

on:
  push:
    paths:
      - 'video/video_bink/**'
      - 'scripts/build-ffmpeg-android.sh'
      - 'scripts/build-android-arm64.sh'
      - 'scripts/build-android-armv7a.sh'
      - 'wscript'
  workflow_dispatch:

jobs:
  build-video-bink-aarch64:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
    - name: Check out source
      uses: actions/checkout@v5
      with:
        submodules: recursive
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -f -y libopenal-dev g++-multilib gcc-multilib libpng-dev libjpeg-dev libfreetype6-dev libfontconfig1-dev libcurl4-gnutls-dev libsdl2-dev zlib1g-dev libbz2-dev libedit-dev
    - name: Fetch NDK and toolchain
      run: |
        wget https://dl.google.com/android/repository/android-ndk-r10e-linux-x86_64.zip -nc -q
        wget https://github.com/llvm/llvm-project/releases/download/llvmorg-11.1.0/clang+llvm-11.1.0-x86_64-linux-gnu-ubuntu-16.04.tar.xz -nc -q
        unzip -q android-ndk-r10e-linux-x86_64.zip
        tar -xf clang+llvm-11.1.0-x86_64-linux-gnu-ubuntu-16.04.tar.xz
    - name: Build FFmpeg
      run: |
        export ANDROID_NDK_HOME=$PWD/android-ndk-r10e/
        export PATH=$PWD/clang+llvm-11.1.0-x86_64-linux-gnu-ubuntu-16.04/bin:$PATH
        ./scripts/build-ffmpeg-android.sh aarch64
    - name: Configure
      run: |
        export ANDROID_NDK_HOME=$PWD/android-ndk-r10e/
        export PATH=$PWD/clang+llvm-11.1.0-x86_64-linux-gnu-ubuntu-16.04/bin:$PATH
        python3 ./waf configure -T release --prefix=../android_build --android=aarch64,host,21 --target=../android_build/aarch64 --disable-warns --togles
    - name: Build video_bink
      run: |
        export ANDROID_NDK_HOME=$PWD/android-ndk-r10e/
        export PATH=$PWD/clang+llvm-11.1.0-x86_64-linux-gnu-ubuntu-16.04/bin:$PATH
        python3 ./waf build --targets=video_bink -j2

  build-video-bink-armv7a:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
    - name: Check out source
      uses: actions/checkout@v5
      with:
        submodules: recursive
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -f -y libopenal-dev g++-multilib gcc-multilib libpng-dev libjpeg-dev libfreetype6-dev libfontconfig1-dev libcurl4-gnutls-dev libsdl2-dev zlib1g-dev libbz2-dev libedit-dev
    - name: Fetch NDK and toolchain
      run: |
        wget https://dl.google.com/android/repository/android-ndk-r10e-linux-x86_64.zip -nc -q
        wget https://github.com/llvm/llvm-project/releases/download/llvmorg-11.1.0/clang+llvm-11.1.0-x86_64-linux-gnu-ubuntu-16.04.tar.xz -nc -q
        unzip -q android-ndk-r10e-linux-x86_64.zip
        tar -xf clang+llvm-11.1.0-x86_64-linux-gnu-ubuntu-16.04.tar.xz
    - name: Build FFmpeg
      run: |
        export ANDROID_NDK_HOME=$PWD/android-ndk-r10e/
        export PATH=$PWD/clang+llvm-11.1.0-x86_64-linux-gnu-ubuntu-16.04/bin:$PATH
        ./scripts/build-ffmpeg-android.sh armeabi-v7a-hard
    - name: Configure
      run: |
        export ANDROID_NDK_HOME=$PWD/android-ndk-r10e/
        export PATH=$PWD/clang+llvm-11.1.0-x86_64-linux-gnu-ubuntu-16.04/bin:$PATH
        python3 ./waf configure -T release --prefix=../android_build --android=armeabi-v7a-hard,host,21 --target=../android_build/armeabi-v7a --disable-warns -4 --togles
    - name: Build video_bink
      run: |
        export ANDROID_NDK_HOME=$PWD/android-ndk-r10e/
        export PATH=$PWD/clang+llvm-11.1.0-x86_64-linux-gnu-ubuntu-16.04/bin:$PATH
        python3 ./waf build --targets=video_bink -j2
