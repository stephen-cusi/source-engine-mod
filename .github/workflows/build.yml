name: Build

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Linux
  # ---------------------------------------------------------------------------

  build-linux-x86_64:
    name: Linux (x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            libbz2-dev \
            libcurl4-gnutls-dev \
            libedit-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libjpeg-dev \
            libopenal-dev \
            libopus-dev \
            libpng-dev \
            libsdl2-dev \
            zlib1g-dev

      - name: Configure
        run: >-
          python3 ./waf configure
          -T release
          --disable-warns
          --prefix="${{ github.workspace }}/linux"
          --build-games=hl2sb
          --enable-opus

      - name: Build
        run:           python3 ./waf build -j2

      - name: Install
        run:           python3 ./waf install -j2

      - name: Save build configuration
        run: cp build/config.log linux/info.txt

      - name: Upload Linux build
        uses: actions/upload-artifact@v7
        with:
          name: source-engine-linux-x86_64
          path: linux
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Android
  # ---------------------------------------------------------------------------

  build-android-armv7a:
    name: Android (armeabi-v7a)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -f -y libopenal-dev g++-multilib gcc-multilib libpng-dev libjpeg-dev libfreetype6-dev libfontconfig1-dev libcurl4-gnutls-dev libsdl2-dev zlib1g-dev libbz2-dev libedit-dev

      - name: Download Android NDK
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r27b-linux.zip -nc -q
          unzip -q android-ndk-r27b-linux.zip

      - name: Configure
        run: |
          export ANDROID_NDK_HOME="${{ github.workspace }}/android-ndk-r27b"
          export PATH="${{ github.workspace }}/android-ndk-r27b/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          python3 ./waf configure \
            -T release \
            --prefix=../android_build \
            --android=armeabi-v7a,host,21 \
            --target=../android_build/armeabi-v7a \
            --disable-warns \
            --build-games=hl2sb \
            --togles

      - name: Build and install
        run: |
          export ANDROID_NDK_HOME="${{ github.workspace }}/android-ndk-r27b"
          export PATH="${{ github.workspace }}/android-ndk-r27b/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          python3 ./waf install --strip

      - name: Upload Android build
        uses: actions/upload-artifact@v7
        with:
          name: build-android-armv7a
          path: /home/runner/work/source-engine-mod/android_build/lib/armeabi-v7a/*.*
          if-no-files-found: error

  build-android-aarch64:
    name: Android (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -f -y libopenal-dev g++-multilib gcc-multilib libpng-dev libjpeg-dev libfreetype6-dev libfontconfig1-dev libcurl4-gnutls-dev libsdl2-dev zlib1g-dev libbz2-dev libedit-dev

      - name: Download Android NDK
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r27b-linux.zip -nc -q
          unzip -q android-ndk-r27b-linux.zip

      - name: Configure
        run: |
          export ANDROID_NDK_HOME="${{ github.workspace }}/android-ndk-r27b"
          export PATH="${{ github.workspace }}/android-ndk-r27b/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          python3 ./waf configure \
            -T release \
            --prefix=../android_build \
            --android=aarch64,host,21 \
            --target=../android_build/aarch64 \
            --disable-warns \
            --build-games=hl2sb \
            --togles

      - name: Build and install
        run: |
          export ANDROID_NDK_HOME="${{ github.workspace }}/android-ndk-r27b"
          export PATH="${{ github.workspace }}/android-ndk-r27b/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          python3 ./waf install --strip

      - name: Upload Android build
        uses: actions/upload-artifact@v7
        with:
          name: build-android-aarch64
          path: /home/runner/work/source-engine-mod/android_build/lib/arm64-v8a/*.*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Windows
  # ---------------------------------------------------------------------------

  build-windows-i386:
    name: Windows (x86)
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Configure
        run: >-
          ./waf.bat configure
          -T release
          --prefix=./win
          --disable-warns
          --build-games=hl2sb
          --32bits
          --enable-opus

      - name: Build and install
        run: >-
          ./waf.bat build &&
          ./waf.bat install

      - name: Cleanup artifacts (remove .lib .pdb .obj .exp .ilk)
        run: |
          Get-ChildItem -Path ./win -Recurse -Include *.lib,*.pdb,*.obj,*.exp,*.ilk | Remove-Item -Force -Recurse

      - name: Upload Windows build
        uses: actions/upload-artifact@v7
        with:
          name: win-source-engine-i386
          path: ./win
          if-no-files-found: error

  build-windows-amd64:
    name: Windows (x64)
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Configure
        shell: pwsh
        run: >-
          ./waf.bat configure
          -T release
          --prefix=./win
          --disable-warns
          --build-games=hl2sb
          --enable-opus

      - name: Build and install
        shell: pwsh
        run: >-
          ./waf.bat build &&
          ./waf.bat install

      - name: Cleanup artifacts (remove .lib .pdb .obj .exp .ilk)
        run: |
          Get-ChildItem -Path ./win -Recurse -Include *.lib,*.pdb,*.obj,*.exp,*.ilk | Remove-Item -Force -Recurse

      - name: Upload Windows build
        uses: actions/upload-artifact@v7
        with:
          name: win-source-engine-amd64
          path: ./win
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # macOS
  # ---------------------------------------------------------------------------

  build-macos-amd64:
    name: macOS (x86_64)
    runs-on: macos-15-intel
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          brew untap aws/tap || true
          brew install sdl2 pkg-config opus

      - name: Configure
        run: >-
          python3 ./waf configure
          -T release
          --disable-warns
          --build-games=hl2sb
          --prefix=./macos
          --enable-opus

      - name: Build and install
        run: |
          python3 ./waf build
          python3 ./waf install

      - name: Upload macOS build
        uses: actions/upload-artifact@v7
        with:
          name: source-engine-macos-amd64
          path: ./macos
          if-no-files-found: error

  build-macos-arm64:
    name: macOS (arm64)
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          brew untap aws/tap || true
          brew install sdl2 pkg-config opus

      - name: Configure
        env:
          MACHINE: ${{ runner.arch }}
        run: |
          if [ "$(uname -m)" != "arm64" ]; then
            echo "Expected arm64 host, got: $(uname -m)" >&2
            exit 1
          fi
          if [ "$(python3 -c 'import platform; print(platform.machine())')" != "arm64" ]; then
            echo "Python reports non-arm64 (likely running under Rosetta); native Python required" >&2
            exit 1
          fi
          python3 ./waf configure -T release --disable-warns --build-games=hl2sb --prefix=./macos --enable-opus

      - name: Build and install
        run: |
          python3 ./waf build
          python3 ./waf install

      - name: Upload macOS build
        uses: actions/upload-artifact@v7
        with:
          name: source-engine-macos-arm64
          path: ./macos
          if-no-files-found: error
