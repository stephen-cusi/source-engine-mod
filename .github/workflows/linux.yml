name: Linux Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux-x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libbz2-dev \
            libcurl4-gnutls-dev \
            libedit-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libjpeg-dev \
            libopenal-dev \
            libpng-dev \
            libsdl2-dev \
            libswresample-dev \
            zlib1g-dev

      - name: Configure
        run: >-
          python3 ./waf configure
          -T release
          --disable-warns
          --prefix="${{ github.workspace }}/linux"
          --build-games=hl2

      - name: Build
        run: python3 ./waf build -j2

      - name: Install
        run: python3 ./waf install -j2

      - name: Save build configuration
        run: cp build/config.log linux/info.txt

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: source-engine-linux-x86_64
          path: linux
          if-no-files-found: error
